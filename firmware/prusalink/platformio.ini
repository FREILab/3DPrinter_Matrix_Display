[platformio]
default_envs = prusa_drucker_3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit Protomatter @ ^1.7.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0

build_flags = 
    -I include
    -D WIFI_SSID_ENV=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASS_ENV=\"${sysenv.WIFI_PASS}\"
    -D IP_SHOW_BUTTON_PIN=7
[env:prusa_drucker_1]
build_flags = 
    ${env.build_flags}
    -D PRUSA_PRINTER_1
    -D CONFIG_NAME_STR=\"Drucker\ 1\"
    -D OTA_HOSTNAME_PREFIX=\"matrix-d1\"
    -D PRINTER_IP=\"10.30.0.138\" 
    -D PRUSA_API_KEY=\"${sysenv.PRUSA_API_KEY_D1}\"
[env:prusa_drucker_2]
build_flags = 
    ${env.build_flags}
    -D PRUSA_PRINTER_2
    -D CONFIG_NAME_STR=\"Drucker\ 2\"
    -D OTA_HOSTNAME_PREFIX=\"matrix-d2\"
    -D PRINTER_IP=\"10.30.0.07\" 
    -D PRUSA_API_KEY=\"${sysenv.PRUSA_API_KEY_D2}\"

[env:prusa_drucker_3]
build_flags = 
    ${env.build_flags}
    -D PRUSA_PRINTER_3
    -D CONFIG_NAME_STR=\"Drucker\ 3\"
    -D OTA_HOSTNAME_PREFIX=\"matrix-d3\"
    -D PRINTER_IP=\"10.30.0.08\" 
    -D PRUSA_API_KEY=\"${sysenv.PRUSA_API_KEY_D3}\"

[env:prusa_drucker_4]
build_flags = 
    ${env.build_flags}
    -D PRUSA_PRINTER_4
    -D CONFIG_NAME_STR=\"Drucker\ 4\"
    -D OTA_HOSTNAME_PREFIX=\"matrix-d4\"
    -D PRINTER_IP=\"10.30.0.74\" 
    -D PRUSA_API_KEY=\"${sysenv.PRUSA_API_KEY_D4}\"


[env:prusa_drucker_1_ota]
extends = env:prusa_drucker_1
upload_protocol = espota
upload_port = matrix-d1.local

[env:prusa_drucker_2_ota]
extends = env:prusa_drucker_2
upload_protocol = espota
upload_port = matrix-d2.local

[env:prusa_drucker_3_ota]
extends = env:prusa_drucker_3
upload_protocol = espota
upload_port = matrix-d3.local

[env:prusa_drucker_4_ota]
extends = env:prusa_drucker_4
upload_protocol = espota
upload_port = matrix-d4.local
